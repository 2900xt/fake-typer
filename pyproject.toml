[project]
name = "fake-typer"
version = "0.1.0"
description = "Types text into any app through a virtual keyboard, with human-like rhythm and typos"
authors = [
    { name = "Taha Rawjani", email = "tahakazim08@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.14.0",
    "evdev>=2.0.0",
]

[project.scripts]
fake-typer = "fake_typer.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
